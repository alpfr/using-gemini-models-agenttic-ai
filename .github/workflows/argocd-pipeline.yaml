name: GitOps Build & Deploy Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'gcp/**'
      - 'README.md'

jobs:
  build-and-deploy:
    name: Build Image & Update Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Authenticate to Google Cloud
      # Set up Workload Identity Federation for passwordless authentication
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/YOUR_GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_WORKLOAD_POOL/providers/YOUR_PROVIDER'
          service_account: 'gemini-deployer@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com'

      # 2. Configure Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 3. Authenticate Docker with Google Artifact Registry
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 4. Build and Push Docker image
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/gemini-repo/gemini-validator:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "NEW_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Update the Kustomize manifest with the new image tag
      - name: Update Kustomize Image Tag
        run: |
          cd k8s/overlays/dev
          kustomize edit set image gcr.io/YOUR_GCP_PROJECT_ID/gemini-validator=${{ env.NEW_IMAGE }}

      # 6. Commit and push the manifest update back to the repo
      # This change triggers ArgoCD to pull and deploy the updated image
      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "gitops-bot"
          git config --global user.email "gitops-bot@github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "gitops: update gemini-validator image tag to ${{ github.sha }} [skip ci]"
          git push
