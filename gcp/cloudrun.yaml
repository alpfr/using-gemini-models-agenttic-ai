apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gemini-validator
  namespace: "YOUR_GCP_PROJECT_ID" # Will be replaced by your project ID/number
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
      - image: gcr.io/YOUR_GCP_PROJECT_ID/gemini-validator:latest
        ports:
        - containerPort: 8080
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_GCP_PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: PORT
          value: "8080"
        resources:
          limits:
            memory: 512Mi
            cpu: 1000m
