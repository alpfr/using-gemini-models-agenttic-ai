apiVersion: v1
kind: Namespace
metadata:
  name: gemini-apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemini-validator-sa
  namespace: gemini-apps
  annotations:
    # Set this to link the Kubernetes ServiceAccount with a GCP Service Account via Workload Identity
    iam.gke.io/gcp-service-account: gemini-validator@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-validator
  namespace: gemini-apps
  labels:
    app: gemini-validator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gemini-validator
  template:
    metadata:
      labels:
        app: gemini-validator
    spec:
      serviceAccountName: gemini-validator-sa
      containers:
      - name: validator
        image: gcr.io/YOUR_GCP_PROJECT_ID/gemini-validator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_GCP_PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-validator-service
  namespace: gemini-apps
spec:
  selector:
    app: gemini-validator
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
