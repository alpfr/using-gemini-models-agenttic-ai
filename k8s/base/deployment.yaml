apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-validator
  labels:
    app: gemini-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemini-validator
  template:
    metadata:
      labels:
        app: gemini-validator
    spec:
      serviceAccountName: gemini-validator-sa
      containers:
      - name: validator
        image: gcr.io/YOUR_GCP_PROJECT_ID/gemini-validator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_GCP_PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: validator-storage
          mountPath: /app/data
      volumes:
      - name: validator-storage
        persistentVolumeClaim:
          claimName: gemini-validator-pvc
