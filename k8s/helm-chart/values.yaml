replicaCount: 2

image:
  repository: gcr.io/YOUR_GCP_PROJECT_ID/gemini-validator
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

gcp:
  projectId: "YOUR_GCP_PROJECT_ID"
  location: "us-central1"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
