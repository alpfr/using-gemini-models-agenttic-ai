apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-validator
spec:
  template:
    spec:
      containers:
      - name: validator
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_DEV_GCP_PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
