apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gemini-validator-app
  namespace: argocd
  labels:
    app: gemini-validator-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/alpfr/using-gemini-models-agenttic-ai.git'
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gemini-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
